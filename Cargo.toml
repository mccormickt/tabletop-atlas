[workspace]
members = ["backend"]
resolver = "3"

[workspace.package]
rust-version = "1.100.0"

[workspace.dependencies]
dropshot = "0.18"
http = "1.5"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1.2", features = ["uuid1", "chrono04"] }
# Dropshot 0.18 uses Schemars 0.8 for its endpoint JsonSchema bounds.
dropshot_schemars = { package = "schemars", version = "0.8", features = ["uuid1", "chrono"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
anyhow = "1.0"
thiserror = "2"
semver = "1.0"
# HTTP client for API calls (rustls with aws-lc-rs, the ecosystem default)
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
# JSON handling
serde_json = "1.0"
# Logging (slog is used by dropshot)
slog = "2.8"
# Static file serving
mime_guess = "2.0"
include_dir = "0.7"
# Command line argument parsing
clap = { version = "4.6", features = ["derive", "env"] }
# Rig LLM, embeddings, PDF loader, and agent framework
rig-core = { version = "0.47", features = ["derive", "pdf", "reqwest"] }
rig-agent = { version = "0.47", default-features = false }
# Vector embeddings for SQLite
sqlite-vec = "0.1"
# Auth dependencies
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
sha2 = "0.11"
hex = "0.4"
cookie = "0.18"
dotenvy = "0.15"
urlencoding = "2.1"
# Plugin registration for extensible tools
inventory = "0.3"
# CSV parsing for BGG imports
csv = "1.4"
# XML parsing for BGG API responses
quick-xml = "0.42"
