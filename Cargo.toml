[workspace]
members = ["backend"]
resolver = "3"

[workspace.dependencies]
dropshot = "0.16"
http = "1.3.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "0.8", features = ["uuid", "chrono"] }
rusqlite = { version = "0.36.0", features = ["bundled"] }
rusqlite_migration = "2.2.0"
anyhow = "1.0.98"
semver = "1.0"
# HTTP client for API calls (using rustls to avoid OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# JSON handling
serde_json = "1.0"
# Logging (slog is used by dropshot)
slog = "2.7"
# Static file serving
mime_guess = "2.0"
include_dir = "0.7"
# Command line argument parsing
clap = { version = "4.5", features = ["derive", "env"] }
# PDF text extraction
pdf-extract = "0.7"
# Vector embeddings for SQLite
sqlite-vec = "0.1"
# Auth dependencies
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
sha2 = "0.10"
hex = "0.4"
cookie = { version = "0.18", features = ["secure"] }
dotenvy = "0.15"
urlencoding = "2.1"
# Plugin registration for extensible tools
inventory = "0.3"
# CSV parsing for BGG imports
csv = "1.3"
# XML parsing for BGG API responses
quick-xml = { version = "0.31", features = ["serialize"] }
