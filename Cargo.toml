[workspace]
members = ["backend"]
resolver = "3"

[workspace.dependencies]
dropshot = "0.16"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
schemars = { version = "0.8", features = ["uuid", "chrono"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
anyhow = "1.0.104"
semver = "1.0.28"
# HTTP client for API calls (rustls with aws-lc-rs, the ecosystem default)
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }
# JSON handling
serde_json = "1.0.151"
# Logging (slog is used by dropshot)
slog = "2.8.2"
# Static file serving
mime_guess = "2.0.5"
include_dir = "0.7.4"
# Command line argument parsing
clap = { version = "4.6.6", features = ["derive", "env"] }
# PDF text extraction (via rig-core "pdf" feature)
# Vector embeddings for SQLite
sqlite-vec = "0.1.9"
# Auth dependencies
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
sha2 = "0.11.0"
hex = "0.4.3"
cookie = { version = "0.18.2", features = ["secure"] }
dotenvy = "0.15.7"
urlencoding = "2.1.3"
# Plugin registration for extensible tools
inventory = "0.3.24"
# CSV parsing for BGG imports
csv = "1.4.0"
# XML parsing for BGG API responses
quick-xml = { version = "0.42.0", features = ["serialize"] }
