contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local packages"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - tabletop-atlas@local

accounts:
  groups:
    - groupname: nobody
      gid: 65534
  users:
    - username: nobody
      uid: 65534
  run-as: nobody

archs:
  - amd64
  - arm64

entrypoint:
  command: /usr/bin/backend

work-dir: /data
