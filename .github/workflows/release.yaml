# Release Workflow
#
# Builds APK packages and container image, pushes to GHCR.
#
# Triggers:
#   - release: Automatically on GitHub release publish
#   - workflow_dispatch: Manual trigger with optional tag input
#
# Flow:
#   1. Setup: Generate signing key and determine version
#   2. Build APK packages for x86_64 and aarch64 (parallel, native runners)
#   3. Build and push container image to GHCR
#   4. Attach APK artifacts to the GitHub release (release events only)

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to build (leave empty to use ref)'
        required: false
      push_latest:
        description: 'Also tag as :latest'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    if: github.repository_owner == 'mccormickt'
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            # Use ref name (tag for releases, or manually selected ref)
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Validate semver for release events, allow any tag for manual runs
          if [ "${{ github.event_name }}" = "release" ]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::Invalid version: $VERSION"; exit 1; }
          fi

          [ -n "$VERSION" ] || { echo "::error::No version/tag specified"; exit 1; }
          echo "image_tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@v1.5.14

      - name: Generate signing key
        run: melange keygen

      - name: Upload signing key (private + public)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            melange.rsa
            melange.rsa.pub
          if-no-files-found: error
          retention-days: 1

  build-apk:
    name: Build APK (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: setup
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download signing key
        uses: actions/download-artifact@v4
        with:
          name: signing-key

      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@v1.5.14

      - name: Ensure cache directories exist
        run: |
          mkdir -p "$HOME/.melange-cache"
          mkdir -p "$HOME/.apk-cache"

      - name: Cache melange dependencies
        uses: actions/cache@v4
        with:
          path: ~/.melange-cache
          key: melange-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'melange.yaml') }}
          restore-keys: |
            melange-${{ matrix.arch }}-
            melange-

      - name: Cache APK packages
        uses: actions/cache@v4
        with:
          path: ~/.apk-cache
          key: apk-${{ matrix.arch }}-${{ hashFiles('melange.yaml') }}
          restore-keys: |
            apk-${{ matrix.arch }}-
            apk-

      - name: Build APK
        run: |
          set -euo pipefail
          sudo melange build melange.yaml \
            --arch ${{ matrix.arch }} \
            --signing-key melange.rsa \
            --cache-dir "$HOME/.melange-cache" \
            --apk-cache-dir "$HOME/.apk-cache" \
            --out-dir packages/

      - name: Fix cache permissions
        if: always()
        run: |
          sudo chown -R runner:runner "$HOME/.melange-cache" "$HOME/.apk-cache"

      - name: Upload APK packages
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: packages/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 1

  build-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [setup, build-apk]
    steps:
      - uses: actions/checkout@v4

      - name: Download x86_64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: packages/x86_64/

      - name: Download aarch64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-aarch64
          path: packages/aarch64/

      - name: Download signing key
        uses: actions/download-artifact@v4
        with:
          name: signing-key

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.image_tag }}"
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.push_latest }}" = "true" ]; then
            TAGS="$TAGS ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: chainguard-images/actions/apko-publish@main
        with:
          config: apko.yaml
          tag: ${{ steps.tags.outputs.tags }}
          keyring-append: melange.rsa.pub

  release:
    name: Attach Release Artifacts
    runs-on: ubuntu-latest
    needs: [setup, build-apk, build-image]
    # Only attach artifacts when triggered by an actual release
    if: github.event_name == 'release'
    steps:
      - name: Download x86_64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: packages/x86_64/

      - name: Download aarch64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-aarch64
          path: packages/aarch64/

      - name: Download signing key
        uses: actions/download-artifact@v4
        with:
          name: signing-key

      - name: Prepare release assets
        run: |
          set -euo pipefail
          TAG="${{ needs.setup.outputs.image_tag }}"

          # Create APK repository archive (both arches + indexes + signing key)
          cp melange.rsa.pub packages/
          tar -czvf "tabletop-atlas-${TAG}-apk-repo.tar.gz" packages/

          # Copy individual APKs with version names
          for arch in x86_64 aarch64; do
            apk=$(find "packages/${arch}" -name "*.apk" -type f)
            [[ -n "$apk" ]] || { echo "::error::No APK found for ${arch}"; exit 1; }
            cp "$apk" "tabletop-atlas-${TAG}-${arch}.apk"
          done

      - name: Attach release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tabletop-atlas-${{ needs.setup.outputs.image_tag }}-apk-repo.tar.gz
            tabletop-atlas-${{ needs.setup.outputs.image_tag }}-x86_64.apk
            tabletop-atlas-${{ needs.setup.outputs.image_tag }}-aarch64.apk
            melange.rsa.pub
