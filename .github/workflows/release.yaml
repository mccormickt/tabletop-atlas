# Release Workflow
#
# Builds APK packages and container image, pushes to GHCR.
#
# Triggers:
#   - release: Automatically on GitHub release publish
#   - workflow_dispatch: Manual trigger with optional tag input
#
# Flow:
#   1. Extract version (from release tag or manual input)
#   2. Build APK packages for x86_64 and aarch64
#   3. Build and push container image to GHCR
#   4. Attach APK artifacts to the GitHub release (release events only)

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to build (leave empty to use ref)'
        required: false
      push_latest:
        description: 'Also tag as :latest'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    if: github.repository_owner == 'mccormickt'
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            # Use ref name (tag for releases, or manually selected ref)
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Validate semver for release events, allow any tag for manual runs
          if [ "${{ github.event_name }}" = "release" ]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::Invalid version: $VERSION"; exit 1; }
          fi

          [ -n "$VERSION" ] || { echo "::error::No version/tag specified"; exit 1; }
          echo "image_tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@v1.5.14

      - name: Ensure cache directories exist
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.melange-cache"
          mkdir -p "$HOME/.apk-cache"

      - name: Cache cargo and pnpm stores
        uses: actions/cache@v4
        with:
          path: ~/.melange-cache
          key: melange-deps-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            melange-deps-

      - name: Cache APK packages
        uses: actions/cache@v4
        with:
          path: ~/.apk-cache
          key: melange-apk-${{ hashFiles('melange.yaml') }}
          restore-keys: |
            melange-apk-

      - name: Generate signing key
        run: melange keygen

      - name: Build APK
        run: |
          set -euo pipefail
          melange build melange.yaml \
            --signing-key melange.rsa \
            --cache-dir "$HOME/.melange-cache" \
            --apk-cache-dir "$HOME/.apk-cache" \
            --out-dir packages/

      - name: Upload APK packages
        uses: actions/upload-artifact@v4
        with:
          name: apk-packages
          path: packages/
          if-no-files-found: error
          retention-days: 1

      - name: Upload signing key (public)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: melange.rsa.pub
          if-no-files-found: error
          retention-days: 1

  build-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: build-apk
    steps:
      - uses: actions/checkout@v4

      - name: Download APK packages
        uses: actions/download-artifact@v4
        with:
          name: apk-packages
          path: packages/

      - name: Download signing key
        uses: actions/download-artifact@v4
        with:
          name: signing-key
          path: .

      - name: Setup apko
        uses: chainguard-dev/actions/setup-apko@v1.5.14

      - name: Ensure cache directory exists
        run: mkdir -p "$HOME/.apk-cache"

      - name: Cache Wolfi packages
        uses: actions/cache@v4
        with:
          path: ~/.apk-cache
          key: apko-${{ hashFiles('apko.yaml') }}
          restore-keys: |
            apko-

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-apk.outputs.image_tag }}"

          # Add :latest tag for release events, or if explicitly requested for manual runs
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.push_latest }}" = "true" ]; then
            TAGS="$TAGS ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi

          apko publish apko.yaml \
            --cache-dir "$HOME/.apk-cache" \
            --keyring-append melange.rsa.pub \
            $TAGS

  release:
    name: Attach Release Artifacts
    runs-on: ubuntu-latest
    needs: [build-apk, build-image]
    # Only attach artifacts when triggered by an actual release
    if: github.event_name == 'release'
    steps:
      - name: Download APK packages
        uses: actions/download-artifact@v4
        with:
          name: apk-packages
          path: packages/

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-apk.outputs.image_tag }}"
          for arch in x86_64 aarch64; do
            apk=$(find "packages/${arch}" -name "*.apk" -type f)
            [[ -n "$apk" ]] || { echo "::error::No APK found for ${arch}"; exit 1; }
            cp "$apk" "tabletop-atlas-${VERSION}-${arch}.apk"
          done

      - name: Attach release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tabletop-atlas-${{ needs.build-apk.outputs.image_tag }}-x86_64.apk
            tabletop-atlas-${{ needs.build-apk.outputs.image_tag }}-aarch64.apk
